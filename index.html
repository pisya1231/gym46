<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гимназия №46 — Онлайн счетчик</title>
<style>
  body { margin: 0; background: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
  .card { background: #111827; border: 1px solid #334155; border-radius: 20px; padding: 40px 25px; max-width: 420px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
  h1 { font-size: 26px; margin-bottom: 10px; background: linear-gradient(90deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #status { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
  .num { font-size: 72px; font-weight: 900; color: #38bdf8; margin: 15px 0 30px; transition: transform 0.15s; }
  button { background: linear-gradient(90deg, #38bdf8, #8b5cf6); color: #fff; border: none; padding: 18px 40px; font-size: 22px; font-weight: 800; border-radius: 14px; cursor: pointer; width: 100%; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="card">
  <h1>ГИМНАЗИЯ №46 🔥</h1>
  <div id="status">Подключение к серверу...</div>
  <div class="num" id="score">4600</div>
  <button onclick="addPoint()">Кинуть респект (+1)</button>
</div>

<script>
  // Используем стабильное облачное хранилище KeyValue / JSONBlob
  const BLOB_URL = 'https://jsonblob.com';
  const scoreEl = document.getElementById('score');
  const statusEl = document.getElementById('status');
  let currentScore = 4600;
  let isUpdating = false;

  function updateUI(val) {
    if (val !== currentScore) {
      currentScore = val;
      scoreEl.innerText = currentScore;
      scoreEl.style.transform = 'scale(1.15)';
      setTimeout(() => scoreEl.style.transform = 'scale(1)', 150);
    }
  }

  // Читаем актуальное число из облака
  async function loadScore() {
    if (isUpdating) return;
    try {
      const res = await fetch(BLOB_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('Ошибка сети');
      const data = await res.json();
      if (typeof data.count === 'number') {
        updateUI(data.count);
        statusEl.innerText = '🟢 Онлайн (синхронизировано)';
        statusEl.style.color = '#22c55e';
      }
    } catch (e) {
      statusEl.innerText = '🔴 Нет связи с сервером (проверьте интернет/VPN)';
      statusEl.style.color = '#ef4444';
    }
  }

  // Прибавляем +1 и сохраняем в облако
  async function addPoint() {
    isUpdating = true;
    const nextScore = currentScore + 1;
    updateUI(nextScore); // Сразу меняем цифру на экране при нажатии
    statusEl.innerText = '⏳ Сохранение...';
    statusEl.style.color = '#f59e0b';

    try {
      const res = await fetch(BLOB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ count: nextScore })
      });
      if (!res.ok) throw new Error('Ошибка сохранения');
      statusEl.innerText = '🟢 Онлайн (сохранено!)';
      statusEl.style.color = '#22c55e';
    } catch (e) {
      statusEl.innerText = '🔴 Ошибка отправки на сервер';
      statusEl.style.color = '#ef4444';
    } finally {
      isUpdating = false;
    }
  }

  loadScore();
  setInterval(loadScore, 2000);
</script>

</body>
</html>
